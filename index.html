<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Atelier Diego Martinez</title>
		<link rel="stylesheet" href="styles.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
		<script type="importmap">
			{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"}}
		</script>
	</head>
	
	<body>
		<h3>Mapway</h3>
		<h2>Proyecto para DataMad 2026</h2>


					<div id="map" style="height: 620px"></div>
					<script type="module">

						import {LeafletMap, TileLayer, Marker, Circle, Polygon} from 'leaflet';
						import 'leaflet/styles.css';

						const map = new LeafletMap('map').setView([40.440486, -3.627189], 100);

						new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
							maxZoom: 19,
							attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
						}).addTo(map);

						const marker = new Marker([40.440486, -3.627189]).addTo(map);
						marker.bindPopup("<b>Hola</b><br>Esta es nuestra universidad").openPopup();


					</script>
	</body>
</html>
