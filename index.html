<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Mapway</title>
		<link rel="stylesheet" href="styles.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
	</head>
	
	<body>
		<h3>Mapway</h3>
		<h2>Proyecto para DataMad 2026</h2>
		<div id="map" style="height: 620px"></div>
		<script type="module">
			///////////////////////////////////////
			// Aqui empieza el código Javascript //
			///////////////////////////////////////

			// Importe de la biblioteca de código para hacer mapas
			import {LeafletMap, TileLayer, Marker, Circle, Polygon, Icon} from 'https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js';

			// Creación de Objeto mapa
			const map = new LeafletMap('map').setView([40.440486, -3.627189], 100);

			// Cogemos visuales y datos de mapa de OpenStreetMap
			new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 19,
				attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
			}).addTo(map);

			// Aqui se van añadiendo los marcadores que vamos creando
			let markers = [];

			// Iconos de pointers
			const UniIcon = new Icon({
				iconUrl: 'UDIT_logo.png',
				iconSize:     [30, 30], // size of the icon
				});

			const WaterIcon = new Icon({
				iconUrl: 'water.png',
				iconSize:     [30, 30], // size of the icon
				});

			// Cogemos el json a partir de la api (control + click izq para descargar y leer en local)
			// Datos ejemplo desfibriladores
			//let dresponse = await fetch('https://datos.madrid.es/dataset/286717-0-desfibriladores-externos-fuera-del-ambito-sanitario/resource/286717-1-desfibriladores-externos-fuera-del-ambito-sanitario/download/286717-1-desfibriladores-externos-fuera-del-ambito-sanitario.json');
			//const ddata = await dresponse.json();
			// Datos fuentes de mascotas			
			let fresponse = await fetch('https://datos.madrid.es/dataset/50055-0-fuentes-mascotas/resource/50055-0-fuentes-mascotas/download/50055-0-fuentes-mascotas.json');
			const fdata = await fresponse.json();
			// Datos papeleras con bolsas para mascotas
			//const presponse = await fetch('https://datos.madrid.es/dataset/300081-0-papeleras-bolsas-excrementos/resource/300081-1-papeleras-bolsas-excrementos/download/300081-1-papeleras-bolsas-excrementos.json');
			//let pdata = await presponse.json();

			// Aqui creamos los marcadores a partir de los datos
			for (let i = 0; i < fdata.length; i++)
			{
				markers.push(new Marker([fdata[i].LATITUD, fdata[i].LONGITUD], {icon: WaterIcon}).addTo(map));
				markers[i].bindPopup(fdata[i].NOM_VIA + "<br>Test").openPopup();
			}

			// Marker de Prueba. Si este no aparece, algo ha ido mal
			const marker = new Marker([40.440486, -3.627189], {icon: UniIcon}).addTo(map);
			marker.bindPopup("<b>Hola</b>Esta es nuestra universidad").openPopup();
		</script>
	</body>
</html>
